<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a150b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="كوت بو ٤ وسبيتة أربع — ورق جنجفة كلاسيكي على طاولة مجلس.">
<title>كوت وسبيتة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{
  /* layout: majlis room — carpet table in the middle, partner on top, opponents left/right, your hand fanned along the bottom */
  --wood:#2a150b; --cushion:#8f1d1b; --cushion2:#5e100f;
  --gold:#e9bd62; --gold2:#b98330; --cream:#f7ecd2; --ink:#3a2412; --mu:#8a6a48;
  --carpet:#ecdcb6; --carpet2:#d8bf8c;
  --us:#2f9e57; --them:#d2412f;
  --f-display:'Lalezar',Tahoma,sans-serif; --f-body:'IBM Plex Sans Arabic',Tahoma,sans-serif;
  --cw:clamp(64px,22vw,118px); /* hand card width; height = width × 1.45 */
  --tw:clamp(48px,14vw,86px);  /* trick card width */
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#5a2e17 0%,#2a150b 55%,#160a05 100%);color:var(--cream);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

.garland{position:fixed;top:0;left:0;width:100%;height:64px;pointer-events:none;opacity:.9}
.cushions{position:fixed;left:0;right:0;bottom:0;height:30%;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,210,140,.06) 46px 48px),linear-gradient(var(--cushion),var(--cushion2));
  border-top:4px solid var(--gold2);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.cushions::before{content:"";position:absolute;inset:14px 0 auto;height:8px;background:repeating-linear-gradient(90deg,#1f6b3a 0 22px,var(--gold) 22px 26px,#c9302c 26px 48px,var(--gold) 48px 52px);opacity:.75}

#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;justify-items:center}
.top{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 4px}
.round-btn{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,#8a4b22,#4a2410);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.round-btn svg{width:22px;height:22px}
.status{flex:1;min-width:0;text-align:center}
.status b{display:block;font:400 20px/1.15 var(--f-display);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status small{font-size:12px;color:#d9c3a0}
.score{background:linear-gradient(#fff8e6,#f1e1bd);color:var(--ink);border:2px solid var(--gold2);border-radius:14px;padding:4px 10px 5px;min-width:128px;box-shadow:0 4px 12px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.score .hd{display:flex;justify-content:space-between;font-size:12px;font-weight:700;border-bottom:1px solid #d9c195;padding-bottom:2px;gap:8px}
.score .sc-big{display:flex;justify-content:space-around;align-items:center;font:400 28px/1.1 var(--f-display)}
.score .sc-big i{width:1px;height:24px;background:#d0b98d}
.score .ft{font-size:11px;text-align:center;color:var(--mu);font-weight:700}
.score .rows{display:grid;grid-template-columns:auto auto;gap:0 10px;font-size:13px;font-weight:700}
.score .rows span:nth-child(even){text-align:left;font:400 17px/1.25 var(--f-display)}
.us{color:var(--us)} .them{color:var(--them)}

/* the table */
.stage{width:100%;max-width:820px;position:relative;min-height:0;padding:0 8px}
.carpet{position:absolute;inset:8% 4% 2%;border-radius:28px;background:
  radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.35),transparent 60%),
  repeating-linear-gradient(45deg,rgba(150,105,50,.09) 0 2px,transparent 2px 22px),
  repeating-linear-gradient(-45deg,rgba(150,105,50,.09) 0 2px,transparent 2px 22px),
  linear-gradient(var(--carpet),var(--carpet2));
  border:6px solid #7a4a1e;box-shadow:inset 0 0 0 3px #e7c27a,inset 0 0 40px rgba(120,70,20,.35),0 18px 30px rgba(0,0,0,.5)}
.carpet::after{content:"";position:absolute;inset:14px;border-radius:18px;border:2px dashed rgba(160,110,50,.5)}
.medal{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(160,110,50,.35);box-shadow:inset 0 0 0 10px rgba(160,110,50,.08)}
.trump{position:absolute;left:8%;bottom:6%;display:flex;align-items:center;gap:6px;background:#fff7e4;color:var(--ink);border:2px solid var(--gold2);border-radius:12px;padding:3px 10px;font:700 13px var(--f-body);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.trump .sy{font:700 22px/1 Georgia,serif}
.red{color:#c8202a}.blk{color:#17171d}

.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-50%);z-index:3}
.seat[data-p="0"]{left:50%;top:92%}
.seat[data-p="1"]{left:calc(100% - clamp(36px,9vw,52px));top:47%}
.seat[data-p="2"]{left:50%;top:9%}
.seat[data-p="3"]{left:clamp(36px,9vw,52px);top:47%}
.ava{position:relative;width:clamp(50px,13vw,70px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:400 clamp(22px,6vw,32px) var(--f-display);color:#fff;border:3px solid var(--gold);box-shadow:0 4px 10px rgba(0,0,0,.45)}
.seat[data-p="0"] .ava{width:clamp(40px,10vw,54px);font-size:clamp(18px,5vw,24px)}
.ava svg.tm{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg)}
.ava svg.tm circle{fill:none;stroke:#3fe08a;stroke-width:5;stroke-linecap:round;stroke-dasharray:189;animation:tm linear forwards}
@keyframes tm{to{stroke-dashoffset:189}}
.seat.act .ava{box-shadow:0 0 0 4px rgba(233,189,98,.45),0 0 22px rgba(255,210,120,.8)}
.tag{background:#fff6df;color:var(--ink);border:2px solid var(--us);border-radius:9px;padding:0 8px;font:700 12px/1.7 var(--f-body);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.tag.them{border-color:var(--them)}
.sub{font:700 11px var(--f-body);background:rgba(42,21,11,.8);color:#ffe6ae;border-radius:8px;padding:0 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fan{display:flex;height:34px;align-items:flex-end}
.fan i{width:22px;height:32px;margin-inline:-7px;border-radius:3px;background:repeating-linear-gradient(45deg,#c46f22 0 2px,#eca844 2px 7px);border:2px solid #fffaf0;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.seat[data-p="1"] .fan,.seat[data-p="3"] .fan{height:30px}
.bubble{position:absolute;top:-10px;background:#fff;color:var(--ink);font:400 18px/1 var(--f-display);padding:8px 12px 6px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.35);white-space:nowrap;animation:pop .25s cubic-bezier(.2,1.5,.4,1);z-index:5}
.seat[data-p="1"] .bubble{right:100%;margin-right:6px}
.seat[data-p="3"] .bubble{left:100%;margin-left:6px}
.seat[data-p="2"] .bubble{top:auto;bottom:-14px;left:100%;margin-left:4px}
.seat[data-p="0"] .bubble{top:-44px}
@keyframes pop{from{transform:scale(.4);opacity:0}}

.trick{position:absolute;left:50%;top:50%;width:0;height:0;z-index:4}
.tc{position:absolute;width:var(--tw);left:calc(var(--tw) / -2);top:calc(var(--tw) * -0.725);transition:transform .32s cubic-bezier(.2,.9,.3,1),opacity .35s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.tc.win{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.pc{display:block;aspect-ratio:100/145;background:#fff;border:1px solid #cfc8b6;border-radius:8%/5.5%;padding:3.2% 3.6%;overflow:hidden}
.pc img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.pc.jk{padding:0}
.pc.jk img{object-fit:cover}

#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;font:400 clamp(22px,6vw,36px)/1.1 var(--f-display);color:#fff;text-shadow:0 3px 0 #7a3a10,0 0 18px rgba(0,0,0,.6);white-space:nowrap;opacity:0;z-index:6}
#toast.show{animation:toast 1.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}

/* me */
.me{width:100%;max-width:820px;min-width:0;padding:0 10px calc(env(safe-area-inset-bottom) + 8px);position:relative;z-index:2}
#bar{position:relative;z-index:5;min-height:46px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;text-align:center;font-size:14px;font-weight:700;color:#fbe9c4;padding:2px 0 22px}
#hand{height:calc(var(--cw) * 1.45 + 26px);display:flex;justify-content:center;align-items:flex-end;direction:ltr;padding-bottom:4px}
.card{width:var(--cw);aspect-ratio:100/145;padding:0;border:0;background:none;cursor:pointer;transition:transform .18s,filter .18s;transform-origin:50% 100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));position:relative}
.card + .card{margin-left:calc(var(--cw) * var(--ov,-0.5))}
.card .pc{width:100%;height:100%}
.card.dim .pc{filter:brightness(.6) saturate(.6)}
.card.sel{filter:drop-shadow(0 0 8px var(--gold)) drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.card.deal{animation:dealIn .4s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes dealIn{from{transform:translateY(-55vh) rotate(25deg);opacity:0}}
.msg{background:rgba(42,21,11,.88);border:1px solid rgba(233,189,98,.5);border-radius:20px;padding:6px 14px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.chip{font:400 18px/1 var(--f-display);border:0;border-radius:12px;padding:10px 14px 8px;cursor:pointer;background:linear-gradient(#ffd27a,#e59a2a);color:#3a1d00;box-shadow:0 3px 0 #9c5b12;min-width:44px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #9c5b12}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.ghost{background:rgba(255,255,255,.1);color:#fbe9c4;box-shadow:none;border:1px solid rgba(255,230,180,.35)}
.chip.on{background:linear-gradient(#9be7b5,#2f9e57);color:#06280f;box-shadow:0 3px 0 #1d6a39}
.chip .sy{font:700 22px/1 Georgia,serif;vertical-align:-2px}
.chip.suit{background:#fffaf0;box-shadow:0 3px 0 #c6a670;min-width:56px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,6,2,.7);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,460px);max-height:calc(100% - 8px);overflow:auto;background:linear-gradient(#fff9ea,#f3e3c0);color:var(--ink);border:3px solid var(--gold2);border-radius:22px;padding:20px 18px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.sheet h2{font:400 32px/1.1 var(--f-display);text-align:center;margin:0 0 4px;color:#7a3a10}
.sheet .lead{text-align:center;color:var(--mu);font-size:13px;margin:0 0 12px}
.sheet label.l{display:block;font-weight:700;font-size:13px;color:var(--mu);margin:12px 0 6px}
.sheet input[type=text]{width:100%;font:500 16px var(--f-body);padding:10px 12px;border-radius:12px;border:2px solid #d8bf8e;background:#fffdf6;color:var(--ink)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{border:2px solid #d8bf8e;background:#fffdf6;border-radius:16px;padding:12px 10px;cursor:pointer;text-align:center;color:var(--ink)}
.gcard.on{border-color:#7a3a10;background:#fff3d6;box-shadow:0 0 0 3px rgba(185,131,48,.35)}
.gcard b{display:block;font:400 22px/1.2 var(--f-display);color:#7a3a10}
.gcard small{font-size:12px;color:var(--mu)}
.seg{display:flex;background:#ead6ad;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px;color:#6b4a28;cursor:pointer}
.seg button.on{background:#fffaf0;color:#7a3a10;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.big{display:block;width:100%;margin-top:14px;font:400 22px/1 var(--f-display);border:0;border-radius:14px;padding:13px 0 11px;cursor:pointer;background:linear-gradient(#ffd27a,#e08f1f);color:#3a1d00;box-shadow:0 4px 0 #9c5b12}
.big.alt{background:#ead6ad;box-shadow:0 4px 0 #c6a670;color:#6b4a28;font-size:19px}
.big:active{transform:translateY(2px)}
.rules{font-size:14px;line-height:1.75}
.rules h3{font:400 20px var(--f-display);color:#7a3a10;margin:12px 0 2px}
.rules p{margin:4px 0}
table.sum{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:6px}
table.sum td,table.sum th{padding:6px;border-bottom:1px solid #e3cf9f;text-align:center}
table.sum th{font-size:12px;color:var(--mu)}
table.sum td:first-child,table.sum th:first-child{text-align:right}
.res{font:400 48px/1 var(--f-display);text-align:center;margin:6px 0}

@media (orientation:landscape) and (min-width:760px){
  :root{--cw:clamp(70px,8vw,110px);--tw:clamp(56px,6.5vw,84px)}
  .cushions{height:24%}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg class="garland" id="garland" aria-hidden="true"></svg>
<div class="cushions" aria-hidden="true"></div>

<div id="app">
  <header class="top">
    <button class="round-btn" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="#f7e3b4" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="status"><b id="stTitle">كوت وسبيتة</b><small id="stSub"></small></div>
    <div class="score" id="score"></div>
  </header>
  <main class="stage" id="stage">
    <div class="carpet"><div class="medal"></div></div>
    <div id="seats"></div>
    <div class="trick" id="trick"></div>
    <div class="trump hidden" id="trump"></div>
    <div id="toast"></div>
  </main>
  <section class="me">
    <div id="bar"></div>
    <div id="hand"></div>
  </section>
</div>
<div id="modal"></div>

<script>
'use strict';
/* ================= basics ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('kout.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('kout.' + k, JSON.stringify(v)); } catch {} }
};
const SET = Object.assign({name: '', game: 'kout', level: 'medium', speed: 'normal', sound: true, cap: 101}, store.get('settings', {}));
const saveSet = () => store.set('settings', SET);
const Q = new URLSearchParams(location.search);
const AUTO = Q.get('auto') === '1', TURBO = AUTO && Q.get('turbo') === '1';
if (AUTO && Q.get('g')) SET.game = Q.get('g');
const spd = ms => TURBO ? 0 : ms * (SET.speed === 'fast' ? .55 : SET.speed === 'slow' ? 1.5 : 1);
const wait = ms => new Promise(r => setTimeout(r, TURBO ? 0 : ms));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* seats: 0 = you (bottom), 1 = right, 2 = top (your partner in كوت), 3 = left; play goes 0 → 1 → 2 → 3 (to the right) */
const NAMES = ['', 'وليد', 'علي', 'سالم'];
const AV_BG = ['#2f9e57', '#2f6fd0', '#c98a12', '#c23b3b'];
const SY = {S: '♠', H: '♥', D: '♦', C: '♣'};
const SN = {S: 'سبيت', H: 'حاس', D: 'ديمن', C: 'كلفس'};
const RED = {H: 1, D: 1};
const RN = {11: 'J', 12: 'Q', 13: 'K', 14: 'A'};
const rk = r => RN[r] || String(r);
const isJk = c => c.s === 'X';
const cardSrc = c => isJk(c) ? (c.r === 15 ? 'cards/joker-color.png' : 'cards/joker-bw.png') : `cards/${rk(c.r)}${c.s}.webp`;
const cardHTML = c => `<span class="pc${isJk(c) ? ' jk' : ''}"><img src="${cardSrc(c)}" alt="" draggable="false"></span>`;
const cardName = c => isJk(c) ? (c.r === 15 ? 'الجيكر' : 'الميكر') : `${rk(c.r)} ${SN[c.s]}`;
const sameCard = (a, b) => a.s === b.s && a.r === b.r;

/* ================= sound ================= */
let AC = null;
function tone(f, d, type = 'sine', vol = .07, f2) {
  const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .02);
}
function sfx(k) {
  if (!SET.sound || TURBO) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (k === 'card') { const b = AC.createBuffer(1, AC.sampleRate * .1, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2; const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); f.type = 'bandpass'; f.frequency.value = 2600; g.gain.value = .35; s.buffer = b; s.connect(f).connect(g).connect(AC.destination); s.start(); }
    else if (k === 'tick') tone(880, .05, 'sine', .04);
    else if (k === 'turn') tone(740, .12, 'sine', .05);
    else if (k === 'win') tone(523, .14, 'triangle', .06, 784);
    else if (k === 'bad') tone(330, .25, 'sawtooth', .05, 110);
    else if (k === 'fanfare') [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .3, 'triangle', .08), i * 140));
    else if (k === 'lose') [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, .35, 'triangle', .07), i * 180));
  } catch {}
}

/* ================= game rules ================= */
/* ---- كوت بو ٤: 36 cards (7–A in every suit, 6♠ 6♣, two jokers), 9 each, teams 0+2 vs 1+3 ---- */
const KOUT = {
  key: 'kout', title: 'كوت بو ٤', team: true, handSize: 9, target: 31,
  deck() {
    const d = [];
    for (const s of 'SHDC') for (let r = 7; r <= 14; r++) d.push({s, r});
    d.push({s: 'S', r: 6}, {s: 'C', r: 6}, {s: 'X', r: 15}, {s: 'X', r: 16});
    return d;
  },
  suit: c => isJk(c) ? G.trump : c.s, // jokers belong to the trump suit
  power(c, led) {
    if (c.s === 'X') return c.r === 15 ? 1000 : 998;             // الجيكر > خال الحكم > الميكر
    if (c.s === G.trump) return c.r === 14 ? 999 : 900 + c.r;
    return c.s === led ? 100 + c.r : 0;
  },
  sort(h) {
    const ord = G.trump ? [G.trump, ...'SHCD'.replace(G.trump, '')] : [...'SHCD'];
    const w = c => isJk(c) ? -1 : ord.indexOf(c.s);
    return h.sort((a, b) => w(a) - w(b) || (isJk(a) && isJk(b) ? a.r - b.r : b.r - a.r));
  }
};
/* ---- سبيتة أربع: 52 cards, 13 each, every player for himself, avoid hearts, Q♠ and 10♦ ---- */
const SBEITA = {
  key: 'sbeita', title: 'سبيتة أربع', team: false, handSize: 13, passN: 4,
  deck() { const d = []; for (const s of 'SHDC') for (let r = 2; r <= 14; r++) d.push({s, r}); return d; },
  suit: c => c.s,

    G.onDecl = k => {
      if (k === 'q') G.decl.q = G.decl.q === 0 ? -1 : 0;
      if (k === 't') G.decl.t = G.decl.t === 0 ? -1 : 0;
      if (k === 'm') G.minus[0] = !G.minus[0];
      upd(); drawSeats();
    };
    G.onGo = () => { G.onGo = G.onDecl = null; setBar(''); res(); };
    upd();
  });
}

/* ---- trick play ---- */
let timerId = null;
function startTimer(onTimeout) {
  clearTimeout(timerId);
  if (!SET.timer || AUTO) { G.timerAt = 0; return; }
  G.timerAt = Date.now(); G.timerLen = SET.timer; drawSeats();
  const gen = G.gen; timerId = setTimeout(() => { if (G.gen === gen) onTimeout(); }, SET.timer * 1000);
}
function stopTimer() { clearTimeout(timerId); G.timerAt = 0; }

async function nextTurn() {
  const gen = G.gen, p = G.cur;
  render();
  if (G.seats[p].bot) {
    await wait(spd(650 + Math.random() * 350)); if (gen !== G.gen) return;
    playCard(p, botPlay(p));
  } else {
    sfx('turn');
    const n = legalCards(0).length;
    setBar(G.trick.length ? (n === G.hands[0].length ? 'دورك' : `دورك — لازم ${SN[ledSuit()]}`) : 'دورك — ابدأ بورقة');
    startTimer(() => { if (G.cur === 0 && !G.busy) playCard(0, botPlay(0)); });
  }
}
async function playCard(p, c) {
  if (G.busy) return;
  const gen = G.gen;
  G.busy = true; stopTimer(); setBar('');
  G.hands[p] = G.hands[p].filter(x => !sameCard(x, c));
  G.trick.push({p, c}); G.played.push(c);
  if (c.s === 'H') G.broken = true;
  sfx('card');
  // fly in from the player's side
  drawHand(); drawSeats(); drawTrick();
  const el = $(`#trick .tc[data-k="${G.trick.length - 1}"]`);
  if (el && !TURBO) {
    const [x, y] = OFF[p], to = el.style.transform;
    el.style.transition = 'none'; el.style.opacity = '0';
    el.style.transform = `translate(calc(var(--tw) * ${x * 3.2}),calc(var(--tw) * ${y * 3.2})) rotate(${p === 0 ? 0 : 20}deg)`;
    void el.offsetWidth; el.style.transition = ''; el.style.opacity = '1'; el.style.transform = to;
  }
  await wait(spd(380)); if (gen !== G.gen) return;
  if (G.trick.length < 4) { G.cur = (p + 1) % 4; G.busy = false; return nextTurn(); }
  // resolve the trick
  const w = trickWinner();
  const wi = G.trick.findIndex(t => t.p === w);
  document.querySelectorAll('#trick .tc')[wi]?.classList.add('win');
  await wait(spd(750)); if (gen !== G.gen) return;
  document.querySelectorAll('#trick .tc').forEach(e => { const [x, y] = OFF[w]; e.style.transform = `translate(calc(var(--tw) * ${x * 3}),calc(var(--tw) * ${y * 3})) scale(.5)`; e.style.opacity = '0'; });
  if (R() === KOUT) G.won[w % 2]++;
  G.taken[w].push(...G.trick.map(t => t.c));
  sfx(R() === KOUT ? (w % 2 === 0 ? 'win' : 'tick') : 'tick');
  await wait(spd(380)); if (gen !== G.gen) return;
  G.trick = []; G.tn++; G.cur = w; G.busy = false;
  if (!G.hands[0].length) return endRound();
  if (R() === KOUT && koutDecided()) return endRound();
  nextTurn();
}
function koutDecided() {
  const bt = G.bidder % 2, need = G.bid, left = KOUT.handSize - G.tn;
  if (G.won[bt] >= need && need < 9) return true;           // made it
  return G.won[bt] + left < need;                            // can no longer make it
}

/* ---- scoring ---- */
async function endRound() {
  const gen = G.gen;
  G.phase = 'done'; G.cur = -1; render();
  let html, over = false, winTeam = -1;
  if (R() === KOUT) {
    const bt = G.bidder % 2, made = G.won[bt] >= G.bid, pts = [0, 0];
    if (made) { if (G.bid === 9) { pts[bt] = KOUT.target; } else pts[bt] = G.bid; }
    else pts[1 - bt] = G.bid * 2;
    G.total[0] += pts[0]; G.total[1] += pts[1];
    if (G.bid === 9 && made) { G.total[bt] = Math.max(G.total[bt], KOUT.target); }
    if (G.total[0] >= KOUT.target || G.total[1] >= KOUT.target) { over = true; winTeam = G.total[0] >= KOUT.target && G.total[0] >= G.total[1] ? 0 : 1; }
    const who = bt === 0 ? 'فريقك' : 'الخصم';
    html = `<h2>${made ? (G.bid === 9 ? 'بون!' : 'جاب طلبه') : 'ما جاب طلبه'}</h2>
      <p class="lead">${esc(seatName(G.bidder))} (${who}) طلب ${G.bid === 9 ? 'بون' : G.bid} ${SY[G.trump]} وأكلوا ${G.won[bt]}</p>
      <table class="sum"><tr><th></th><th class="us">لنا</th><th class="them">لهم</th></tr>
      <tr><td>الجولة</td><td>+${pts[0]}</td><td>+${pts[1]}</td></tr>
      <tr><td><b>المجموع</b></td><td><b>${G.total[0]}</b></td><td><b>${G.total[1]}</b></td></tr></table>`;
    sfx(made === (bt === 0) ? 'win' : 'bad');
  } else {
    const pts = [0, 1, 2, 3].map(livePts);
    pts.forEach((v, p) => { G.total[p] += v; });
    const mx = Math.max(...G.total);
    if (G.tiebreak || mx >= G.cap) {
      const mn = Math.min(...G.total);
      if (G.total.filter(x => x === mn).length > 1 && !G.tiebreak) G.tiebreak = true;
      else { over = true; G.tiebreak = false; }
    }
    html = `<h2>نهاية الجولة ${G.round}</h2>
      <table class="sum"><tr><th></th><th>الجولة</th><th>المجموع</th></tr>
      ${[0, 1, 2, 3].map(p => `<tr><td>${esc(seatName(p))}</td><td>${pts[p] > 0 ? '+' : ''}${pts[p]}</td><td><b>${G.total[p]}</b></td></tr>`).join('')}</table>
      ${G.tiebreak ? '<p class="lead">تعادل على الأقل — جولة فاصلة بدون تمرير</p>' : ''}`;
    sfx(pts[0] <= 0 ? 'win' : 'tick');
  }
  render();
  if (over) return gameOver(winTeam);
  if (AUTO) { await wait(10); if (gen === G.gen) newRound(); return; }
  sheet(html + '<button class="big" data-go="next">الجولة التالية</button>');
}
function gameOver(winTeam) {
  G.phase = 'over';
  let won, html;
  if (R() === KOUT) {
    won = winTeam === 0;
    const kout = G.total[1 - winTeam] === 0;
    html = `<h2>${won ? (kout ? 'كوت! فزتوا' : 'فزتوا!') : (kout ? 'انكوّتوا' : 'خسرتوا')}</h2>
      <div class="res"><span class="us">${G.total[0]}</span> : <span class="them">${G.total[1]}</span></div>`;
  } else {
    const order = [0, 1, 2, 3].sort((a, b) => G.total[a] - G.total[b]);
    won = order[0] === 0;
    html = `<h2>${won ? 'فزت!' : `فاز ${esc(seatName(order[0]))}`}</h2><p class="lead">أقل نقاط يفوز</p>
      <table class="sum"><tr><th>الترتيب</th><th>النقاط</th></tr>${order.map((p, k) => `<tr><td>${k + 1}. ${esc(seatName(p))}</td><td><b>${G.total[p]}</b></td></tr>`).join('')}</table>`;
  }
  const st = store.get('stats', {});
  const k = R().key; st[k] = st[k] || {w: 0, l: 0}; won ? st[k].w++ : st[k].l++;
  if (!AUTO) store.set('stats', st);
  sfx(won ? 'fanfare' : 'lose');
  if (AUTO) { window.__result = {game: R().key, rounds: G.round, total: G.total.slice()}; return; }
  sheet(html + '<button class="big" data-go="again">لعبة جديدة</button><button class="big alt" data-go="home">القائمة الرئيسية</button>');
}

/* ================= input ================= */
$('#hand').addEventListener('click', e => {
  const b = e.target.closest('.card'); if (!b || !G) return;
  const c = G.hands[0][+b.dataset.k];
  if (G.phase === 'pass' && G.onSel) {
    const i = G.sel.findIndex(x => sameCard(x, c));
    if (i >= 0) G.sel.splice(i, 1); else if (G.sel.length < SBEITA.passN) G.sel.push(c);
    sfx('tick'); drawHand(); G.onSel(); return;
  }
  if (G.phase === 'play' && G.cur === 0 && !G.busy && !G.seats[0].bot) {
    if (!legal(0, c)) { setBar(ledSuit() ? `لازم تنزل ${SN[ledSuit()]}` : 'ما تقدر تبدأ بالحاس الحين'); sfx('bad'); return; }
    playCard(0, c);
  }
});
$('#bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !G) return;
  if (b.dataset.bid != null && G.onBid) G.onBid(+b.dataset.bid);
  else if (b.dataset.tr && G.onTrump) G.onTrump(b.dataset.tr);
  else if (b.dataset.act === 'pass' && G.onPass && G.sel.length === SBEITA.passN) G.onPass();
  else if (b.dataset.dec && G.onDecl) G.onDecl(b.dataset.dec);
  else if (b.dataset.act === 'go' && G.onGo) G.onGo();
});

/* ================= menus ================= */
function sheet(html) { $('#modal').innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
const closeSheet = () => { $('#modal').innerHTML = ''; };
const seg = (key, opts) => `<div class="seg" data-seg="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(SET[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const settingsHtml = () => `
  <label class="l">الصعوبة</label>${seg('level', [['easy', 'سهل'], ['medium', 'متوسط'], ['hard', 'صعب']])}
  <label class="l">سرعة اللعب</label>${seg('speed', [['slow', 'هادي'], ['normal', 'عادي'], ['fast', 'سريع']])}
  <label class="l">مؤقت الدور</label>${seg('timer', [[0, 'بدون'], [30, '٣٠ ثانية'], [15, '١٥ ثانية']])}
  <label class="l">الصوت</label>${seg('sound', [[true, 'تشغيل'], [false, 'إيقاف']])}`;
function homeScreen() {
  const st = store.get('stats', {}), s = k => st[k] ? `${st[k].w} فوز · ${st[k].l} خسارة` : 'ما لعبت للحين';
  sheet(`<h2>الديوانية</h2><p class="lead">اختر اللعبة</p>
    <div class="games">
      <div class="gcard${SET.game === 'kout' ? ' on' : ''}" data-game="kout"><b>كوت بو ٤</b><small>فريقين · ٩ أوراق · طلب وحكم</small><br><small>${s('kout')}</small></div>
      <div class="gcard${SET.game === 'sbeita' ? ' on' : ''}" data-game="sbeita"><b>سبيتة أربع</b><small>كل واحد بروحه · ١٣ ورقة</small><br><small>${s('sbeita')}</small></div>
    </div>
    <label class="l" for="nm">اسمك</label><input type="text" id="nm" maxlength="14" placeholder="أنت" value="${esc(SET.name)}">
    <div id="capRow" class="${SET.game === 'sbeita' ? '' : 'hidden'}"><label class="l">قيد سبيتة</label>${seg('cap', [[51, '٥١'], [101, '١٠١'], [151, '١٥١']])}</div>
    ${settingsHtml()}
    <button class="big" data-go="start">ابدأ اللعب</button>
    <button class="big alt" data-go="rules">طريقة اللعب</button>`);
}
function menu() {
  sheet(`<h2>القائمة</h2>${settingsHtml()}
    <button class="big" data-go="resume">رجوع للعبة</button>
    <button class="big alt" data-go="rules">طريقة اللعب</button>
    <button class="big alt" data-go="again">لعبة جديدة</button>
    <button class="big alt" data-go="home">القائمة الرئيسية</button>`);
}
function rules(back) {
  const kout = `<h3>كوت بو ٤</h3>
    <p>أربعة لاعبين في فريقين، شريكك قدامك. ٣٦ ورقة: من ٧ لين الإكة في كل نوع، و٦ السبيت و٦ الكلفس، والجيكر والميكر. لكل لاعب ٩ أوراق.</p>
    <p><b>الطلب:</b> من ٥ (باب) لين ٩ (بون)، وكل واحد يطلب مرة وحدة أعلى من اللي قبله أو يقول باس. إذا الكل باس، آخر واحد ملزوم بـ٥.</p>
    <p><b>الحكم:</b> صاحب أعلى طلب يختار الحكم ويبدأ اللعب. الجوكرين يحسبون من الحكم.</p>
    <p><b>القوة:</b> الجيكر، بعده خال الحكم (الإكة)، بعده الميكر، بعده باقي الحكم من الشايب ونازل، بعدها النوع اللي نزل أول.</p>
    <p><b>اللعب:</b> لازم تنزل من النوع اللي نزل إذا عندك، وإذا ما عندك تقدر تحكم أو ترمي أي ورقة.</p>
    <p><b>الحساب:</b> إذا الفريق جاب طلبه ياخذ نقاط الطلب، وإذا ما جابه ياخذ الخصم ضعف الطلب. البون إذا انجاب يفوز بالقيد مباشرة. القيد ٣١، وإذا فزت والخصم صفر = كوت.</p>`;
  const sb = `<h3>سبيتة أربع</h3>
    <p>أربعة لاعبين كل واحد بروحه، ١٣ ورقة لكل لاعب. الهدف تاكل أقل نقاط.</p>
    <p><b>التمرير:</b> كل جولة تمرّر ٤ أوراق، مرة يمين ومرة يسار.</p>
    <p><b>النقاط:</b> كل حاس بنقطة، ميمة السبيت (Q♠) بـ١٣، عشرة الديمن (10♦) بـ١٠. إذا علّنت الورقة قبل اللعب تصير بالضعف (٢٦ و٢٠).</p>
    <p><b>ماينس:</b> إذا علّنت ماينس وما أكلت ولا أكلة تاخذ −١٠، وإذا أكلت تنضاف عليك ٢٠. وإذا ما أكلت شي بدون ماينس تاخذ −٥.</p>
    <p><b>اللعب:</b> اللي عنده ٢ الكلفس يبدأ. لازم تنزل من نفس النوع إذا عندك. ما تبدأ بالحاس لين ينكسر، وما ترمي نقاط في أول أكلة.</p>
    <p><b>النهاية:</b> أول ما أحد يوصل القيد تخلص اللعبة، واللي عنده أقل نقاط يفوز. إذا تعادلوا على الأقل فيه جولة فاصلة بدون تمرير.</p>`;
  sheet(`<h2>طريقة اللعب</h2><div class="rules">${SET.game === 'sbeita' ? sb + kout : kout + sb}</div><button class="big" data-go="${back}">تمام</button>`);
}
$('#modal').addEventListener('click', e => {
  const gc = e.target.closest('[data-game]');
  if (gc) { SET.game = gc.dataset.game; saveSet(); document.querySelectorAll('.gcard').forEach(x => x.classList.toggle('on', x === gc)); $('#capRow').classList.toggle('hidden', SET.game !== 'sbeita'); return; }
  const sg = e.target.closest('.seg button');
  if (sg) {
    const key = sg.parentElement.dataset.seg, raw = sg.dataset.v;
    SET[key] = raw === 'true' ? true : raw === 'false' ? false : /^\d+$/.test(raw) ? +raw : raw;
    saveSet(); sg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sg)); return;
  }
  const go = e.target.closest('[data-go]'); if (!go) return;
  const nm = $('#nm'); if (nm) { SET.name = nm.value.trim(); saveSet(); }
  const a = go.dataset.go;
  if (a === 'start' || a === 'again') { closeSheet(); newMatch(); setBar(''); newRound(); }
  else if (a === 'next') { closeSheet(); newRound(); }
  else if (a === 'rules') rules(G && G.phase !== 'idle' && G.phase !== 'over' ? 'menu' : 'home');
  else if (a === 'menu') menu();
  else if (a === 'home') { if (G) G.gen++; homeScreen(); }
  else if (a === 'resume') closeSheet();
});
$('#menuBtn').addEventListener('click', () => { sfx('tick'); menu(); });

/* garland of stars and crescents */
(function () {
  const g = $('#garland'); g.setAttribute('viewBox', '0 0 1200 64'); g.setAttribute('preserveAspectRatio', 'none');
  let h = '';
  for (let k = 0; k < 4; k++) {
    const x0 = k * 300, dip = 46 + (k % 2) * 8;
    h += `<path d="M${x0} 6 Q${x0 + 150} ${dip} ${x0 + 300} 6" fill="none" stroke="#e9bd62" stroke-width="1.2" opacity=".6"/>`;
    for (let j = 1; j < 6; j++) {
      const t = j / 6, x = x0 + 300 * t, y = (1 - t) * (1 - t) * 6 + 2 * (1 - t) * t * dip + t * t * 6;
      h += j % 2 ? `<path transform="translate(${x} ${y + 5}) scale(.9)" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z" fill="#ffd77a"/>` : `<path transform="translate(${x} ${y + 6})" d="M3-6a6 6 0 1 0 0 12a4.6 4.6 0 1 1 0-12z" fill="#ffd77a"/>`;
    }
  }
  g.innerHTML = h;
})();
// warm the image cache
for (const c of [...KOUT.deck(), ...SBEITA.deck()]) { const i = new Image(); i.src = cardSrc(c); }

newMatch();
if (AUTO) { SET.sound = false; newRound(); }
else { render(); homeScreen(); }
</script>
</body>
