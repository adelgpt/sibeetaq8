<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="سبيتة">
<meta name="theme-color" content="#1d3249"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>سبيتة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Aref+Ruqaa&family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  /* layout: one-screen card room — tiled floor, grey table in the centre, opponents right / front / left, your hand fanned along the bottom */
  --night:#0a1a2b; --panel:rgba(9,24,40,.9); --line:rgba(255,255,255,.14);
  --tx:#f4f7fb; --mu:#a9bdd2; --amber:#ffb432; --amber-ink:#2b1800; --red:#d8343b; --good:#35c27a;
  --card:#fcfbf7; --card-ink:#16181d; --ch:1.55; /* card height = width × --ch (keep in sync with CARD_H in JS) */
  --f-display:'Lalezar',Tahoma,sans-serif; --f-body:'IBM Plex Sans Arabic',Tahoma,sans-serif; --f-card:'Fredoka',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--tx);font-family:var(--f-body);overflow:hidden}
#app{height:100%}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.floor{background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 35%,rgba(2,12,26,.62) 100%),var(--tile) 0 0/72px 44px,#123f6b}

/* ---------- shared ---------- */
.btn{font:400 18px/1.2 var(--f-display);background:linear-gradient(#ffc75a,#f39a1c);color:var(--amber-ink);border:0;border-radius:13px;padding:9px 20px 7px;box-shadow:0 4px 0 #b3660a;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b3660a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.wide{width:100%}
.scrim{position:fixed;inset:0;background:rgba(3,10,18,.62);display:grid;place-items:center;z-index:30;padding:16px;animation:fade .2s}
.sheet{background:#0f2238;border:1px solid var(--line);border-radius:22px;padding:18px;width:min(100%,430px);max-height:100%;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.sheet h3{font:400 28px/1.2 var(--f-display);margin:0 0 4px;text-align:center}
.sheet .sub{color:var(--mu);text-align:center;font-size:13px;margin:0 0 14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.label{font:700 13px var(--f-body);color:var(--mu);margin:14px 0 8px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}

/* ---------- login ---------- */
.login{height:100%;overflow:auto;display:grid;place-items:center;padding:16px}
.lg{width:min(100%,370px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .3s}
.fan{display:flex;justify-content:center;height:92px;margin-bottom:6px}
.fan .card{--w:54px;margin:0 -12px;transform-origin:50% 120%}
.brand{font:400 clamp(46px,12vw,68px)/1 var(--f-display);text-align:center;color:#fff;text-shadow:0 4px 0 #0b2a4a,0 10px 20px rgba(0,0,0,.45);margin:0}
.tag{color:var(--mu);text-align:center;font-size:13px;margin:4px 0 18px}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.field input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--tx);font:500 16px var(--f-body)}
.err{color:#ff8a8f;font-size:13px;min-height:20px;text-align:center}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:12px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.note{color:var(--mu);font-size:11.5px;text-align:center;margin-top:12px;line-height:1.6}

/* ---------- home ---------- */
.home{height:100%;overflow-y:auto;box-sizing:border-box;padding:14px 16px 28px}
.home-in{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.me-ava{width:56px;height:56px;border-radius:24%;overflow:hidden;flex:none}
.me-info{flex:1;min-width:0}
.me-name{font:700 16px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvline{display:flex;align-items:center;gap:8px;margin-top:3px}
.star{display:inline-grid;place-items:center;width:30px;height:30px;font:700 12px var(--f-card);color:#06303a;background:#5fd0e4;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);flex:none}
.xp{height:9px;border-radius:6px;background:rgba(0,0,0,.4);flex:1;max-width:170px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd466,#ff9d1a)}
.xpt{font:500 11px var(--f-card);color:var(--mu);font-variant-numeric:tabular-nums}
.hero{text-align:center;margin:20px 0 14px}
.hero .brand{font-size:clamp(52px,13vw,84px)}
.sect{font:400 22px var(--f-display);margin:18px 2px 10px}
.stages{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.stage{scroll-snap-align:start;background:#fff;color:#1b2735;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;flex-direction:column}
.stage .hd{background:var(--c);color:#fff;padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.stage .hd b{font:400 24px var(--f-display)}
.stage .hd span{font:700 13px var(--f-card);background:rgba(255,255,255,.22);border-radius:8px;padding:2px 8px}
.stage .bd{padding:12px;display:grid;gap:7px;font-size:13px;flex:1}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#eef2f7;border-radius:10px;padding:7px 10px;font:600 14px 'El Messiri',var(--f-body);color:#1f2d3d;white-space:nowrap}
.kv b{font:700 15px 'El Messiri',var(--f-card);color:#101a26}
.kv b{font:600 14px var(--f-card);font-variant-numeric:tabular-nums}
.stage .btn{margin-top:4px}
.stage.locked .hd{background:#8a96a6}
.lockmsg{text-align:center;color:#5b6878;font-weight:700;padding:9px 0 3px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:18px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:0;text-align:right;color:#fff}
.mode b{font:400 25px/1.1 var(--f-display)}
.mode small{font-size:12.5px;opacity:.9}
.mode.train{background:linear-gradient(160deg,#e25ea4,#a8336f)}
.mode.friends{background:linear-gradient(160deg,#3cb574,#1f7a4a);opacity:.6;cursor:default}
.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:600 22px var(--f-card);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mu)}
.logout{background:none;border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px}

/* setup sheet */
.dopts{display:grid;gap:8px}
.dopt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--tx);text-align:right}
.dopt b{font:400 21px var(--f-display);display:block}
.dopt small{color:var(--mu);font-size:12.5px}
.dopt.on{border-color:var(--amber);background:rgba(255,180,50,.1)}
.dots{display:flex;gap:3px;margin-inline-start:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots i.f{background:var(--amber)}
.mt{position:relative;height:200px;margin:0 auto;max-width:300px}
.mt .tb{position:absolute;left:22%;right:22%;top:26%;bottom:26%;background:linear-gradient(#7a767d,#5d5a60);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);border-radius:6px}
.chair{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--tx);cursor:pointer;transform:translate(-50%,-50%);padding:0}
.chair .ca{width:50px;height:50px;border-radius:24%;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.chair .you{display:grid;place-items:center;width:50px;height:50px;border-radius:24%;border:2px dashed var(--amber);font:400 18px var(--f-display);color:var(--amber);box-sizing:border-box}
.chair small{font-size:11.5px;font-weight:700}
.c0{left:50%;top:86%}.c1{left:88%;top:50%}.c2{left:50%;top:14%}.c3{left:12%;top:50%}
.seatline{text-align:center;font-size:12.5px;color:var(--mu);margin-top:6px}
.seatline b{color:var(--tx)}

/* ---------- game ---------- */
.game{position:relative;height:100%;overflow:hidden;--av:clamp(56px,13vw,84px);--hc:72px;--ov:-30px;--tc:clamp(62px,13vw,104px);--hh:calc(var(--hc)*1.24)}
.hud{position:absolute;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:8px;z-index:8;direction:ltr;width:96px}
.ibtn{width:44px;height:44px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx);cursor:pointer;padding:0}
.ibtn svg{width:22px;height:22px}
.hcount{height:44px;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 12px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-card);direction:ltr}
.hcount span{color:#ff5a60;font-size:20px}
.hcount b{font-size:19px;font-variant-numeric:tabular-nums}
.hcount small{color:var(--mu);font-size:12px}
.ibtn.exit{background:linear-gradient(#ff6a6f,#c9272e);border-color:transparent}
.score{position:absolute;top:10px;right:10px;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 9px;display:grid;gap:4px;font-family:var(--f-card);font-variant-numeric:tabular-nums;min-width:74px}
.score .cap{font:700 10.5px var(--f-body);color:var(--mu);text-align:center;border-bottom:1px solid var(--line);padding-bottom:3px}
.srow{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.srow .mini{width:20px;height:20px;border-radius:6px;overflow:hidden;flex:none}
.srow .nm{font:500 12px var(--f-body);color:var(--mu);flex:1;white-space:nowrap}
.srow b{margin-inline-start:auto}
.srow.lead b{color:var(--good)}
@media (max-width:560px){.srow .nm{display:none}}

.seat{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;gap:5px}
.seat.p2{top:10px;left:50%;transform:translateX(-50%)}
.seat.p1,.seat.p3{top:calc(50% + (var(--av) + 48px - var(--hh) - 74px)/2);transform:translateY(-50%)}
.seat.p1{right:10px}
.seat.p3{left:10px}
.seat.p0{right:10px;bottom:calc(var(--hh) + 16px);--av:clamp(46px,10vw,66px)}
.ava{position:relative;width:var(--av);height:var(--av);border-radius:24%;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.45);transition:box-shadow .25s}
.ava svg{display:block;width:100%;height:100%}
.seat.on .ava{box-shadow:0 0 0 4px var(--amber),0 0 24px 6px rgba(255,180,50,.55)}
.nametag{background:#0b1726;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:1px 8px 2px 4px;font:700 13px var(--f-body);display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.seat.on .nametag{background:var(--amber);color:var(--amber-ink)}
.lv{display:inline-grid;place-items:center;width:22px;height:22px;font:700 10px var(--f-card);color:#06303a;background:#5fd0e4;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.bub{position:absolute;top:-14px;left:-16px;z-index:2;background:linear-gradient(#ff6a52,#e0442c);color:#fff;font:700 16px/1 var(--f-card);padding:5px 8px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.4);display:flex;align-items:center;gap:3px}
.bub::after{content:'';position:absolute;bottom:-6px;right:10px;border:6px solid transparent;border-top-color:#e0442c;border-bottom:0}
.pens{display:flex;gap:4px;min-height:0}
.chip{font:700 11.5px var(--f-card);border-radius:6px;padding:1px 6px;direction:ltr;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.chip.q{background:#15171c;color:#fff;border:1px solid #444}
.chip.t{background:#fff;color:var(--red)}
.chip.dec{background:var(--amber);color:var(--amber-ink);font-family:var(--f-body)}
.backs{position:absolute;top:22%;display:flex;direction:ltr}
.p2 .backs{left:calc(100% + 10px)}
.p1 .backs{right:calc(100% + 6px)}
.p3 .backs{left:calc(100% + 6px)}
.bk{width:17px;height:25px;border-radius:3px;background:repeating-linear-gradient(45deg,#3a8ee0 0 3px,#1f65b0 3px 6px);border:1.5px solid #fff;margin-left:-9px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.bk:first-child{margin-left:0}
.bkn{font:700 11px var(--f-card);background:#0b1726;border-radius:6px;padding:0 5px;margin-left:4px;align-self:center}

.tzone{position:absolute;left:calc(var(--av) + 40px);right:calc(var(--av) + 40px);top:calc(var(--av) + 58px);bottom:calc(var(--hh) + 74px);display:grid;place-items:center;z-index:2}
.table{position:relative;width:min(100%,560px);height:min(100%,330px);filter:drop-shadow(0 20px 16px rgba(0,0,0,.45))}
.table .face{position:absolute;inset:0 0 15% 0;background:linear-gradient(180deg,#7a767d,#5d5a60 80%);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
.table .skirt{position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(#48464c,#29272c);clip-path:polygon(0 0,100% 0,95% 100%,5% 100%)}
.pile{position:absolute;inset:0 0 15% 0}
.slot{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.t0{left:50%;top:73%;--rot:-2deg}.t1{left:79%;top:47%;--rot:5deg}.t2{left:50%;top:25%;--rot:2deg}.t3{left:21%;top:47%;--rot:-5deg}
.pile .card{--w:var(--tc)}
.card.in0{animation:in0 .3s ease-out}.card.in1{animation:in1 .3s ease-out}.card.in2{animation:in2 .3s ease-out}.card.in3{animation:in3 .3s ease-out}
@keyframes in0{from{transform:translateY(140px) scale(1.25);opacity:0}}
@keyframes in1{from{transform:translateX(160px);opacity:0}}
@keyframes in2{from{transform:translateY(-140px);opacity:0}}
@keyframes in3{from{transform:translateX(-160px);opacity:0}}
.card.sw0{animation:sw0 .45s ease-in forwards}.card.sw1{animation:sw1 .45s ease-in forwards}.card.sw2{animation:sw2 .45s ease-in forwards}.card.sw3{animation:sw3 .45s ease-in forwards}
@keyframes sw0{to{transform:translateY(220px) scale(.4);opacity:0}}
@keyframes sw1{to{transform:translateX(260px) scale(.4);opacity:0}}
@keyframes sw2{to{transform:translateY(-220px) scale(.4);opacity:0}}
@keyframes sw3{to{transform:translateX(-260px) scale(.4);opacity:0}}
.say{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);background:rgba(10,24,40,.82);padding:4px 12px;border-radius:999px;font:700 12.5px var(--f-body);white-space:nowrap;pointer-events:none;z-index:3;max-width:92%;overflow:hidden;text-overflow:ellipsis}

.card{position:relative;flex:none;width:var(--w);height:calc(var(--w)*var(--ch));background:linear-gradient(170deg,#fff,var(--card) 60%,#efece4);color:var(--card-ink);border-radius:calc(var(--w)*.12);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.1);font-family:var(--f-card);user-select:none;direction:ltr}
.card.r{color:var(--red)}
.card .ix{position:absolute;top:4%;left:6%;display:flex;flex-direction:column;align-items:center;line-height:.95;font-weight:700;font-size:calc(var(--w)*.36)}
.card .ix i{font-style:normal;font-size:calc(var(--w)*.34);margin-top:calc(var(--w)*.02);font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',Arial,sans-serif}
.card .pip{position:absolute;right:6%;bottom:3%;font-size:calc(var(--w)*.74);line-height:1}
.card .ix{z-index:1}
.card .court{position:absolute;left:34%;top:6%;right:6%;bottom:5%;border-radius:calc(var(--w)*.05);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.card .court svg{display:block;width:100%;height:100%}
/* deck styles */
.card.d-gold{background:linear-gradient(170deg,#fffaf0,#f4e8cf);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 2px #c9a24a,inset 0 0 0 4px #fffaf0,inset 0 0 0 5px rgba(201,162,74,.5)}
.card.d-gold .ix{color:#1d1a14}.card.d-gold.r .ix,.card.d-gold.r .pip{color:#b0262e}
.card.d-night{background:linear-gradient(170deg,#2c3240,#171b24);color:#eef2f7;box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.15)}
.card.d-night.r{color:#ff6f73}
.bk.d-gold{background:repeating-linear-gradient(45deg,#8e1f2b 0 3px,#6b1520 3px 6px);border-color:#e2b23c}
.bk.d-night{background:repeating-linear-gradient(45deg,#1e2430 0 3px,#11151d 3px 6px);border-color:#5fd0e4}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f2b632 60%,#c98a12);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2);vertical-align:-2px;margin-inline-end:4px}
.coins{display:flex;align-items:center;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px;font:700 15px var(--f-card);font-variant-numeric:tabular-nums}
.coins .coin{width:18px;height:18px}
.card .pips{position:absolute;left:25%;right:25%;top:6%;bottom:6%}
.card .pips svg{display:block;width:100%;height:100%}
.card .ix2{top:auto;left:auto;right:5%;bottom:4%;transform:rotate(180deg)}
.card.d-classic .court{left:22%;right:22%;top:6%;bottom:6%}
.card.d-modern .court{box-shadow:none}
.bk.d-classic{background:repeating-linear-gradient(45deg,#b3242d 0 3px,#8a1820 3px 6px);border-color:#fff}
.pile{perspective:800px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.05);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.setrow span{font-weight:700}
.setrow small{display:block;color:var(--mu);font-weight:500;font-size:12px}
.switch{flex:none;width:52px;height:30px;border-radius:999px;border:0;background:#33465e;position:relative;cursor:pointer;padding:0}
.switch i{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s}
.switch.on{background:var(--good)}
.switch.on i{right:25px}
.decks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:420px}
.deckopt{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--tx);font:700 13px var(--f-body)}
.deckopt.on{border-color:var(--amber);box-shadow:0 0 18px rgba(255,180,50,.3)}
.deckopt .pv{display:flex;height:calc(56px*var(--ch) + 6px);align-items:flex-end}
.deckopt .pv .card{--w:56px}
.deckopt .pv .card+.card{margin-left:-26px;transform:rotate(8deg)}

.hand{position:absolute;left:0;right:0;bottom:calc(var(--hc)*-.2);display:flex;justify-content:center;direction:ltr;z-index:6;padding-inline:12px}
.hand .card{--w:var(--hc);margin-left:var(--ov);cursor:pointer;transition:transform .15s,filter .15s;transform:translateY(var(--y,0px)) rotate(var(--r,0deg));transform-origin:50% 130%;box-shadow:-3px 3px 10px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.1)}
.hand .card:first-child{margin-left:0}
.hand .card.ok:hover{transform:translateY(calc(var(--y,0px) - 14px)) rotate(var(--r,0deg))}
.hand .card.no{filter:brightness(.78) saturate(.75);cursor:not-allowed}
.hand .card.ok{filter:none}

const SN={H:'حاس',S:'سبيت',D:'ديمن',C:'كلفس'};

function nzDeck(N,jk){

function nzRound(){

function nzBidStep(){

/* ---------- نذالة AI: simulation + Monte-Carlo ---------- */
function nzOrder(tr,s){ // keys from strongest to weakest of an (effective) suit
  const o=[];if(s===tr){o.push('X15',s+14,'X16');for(let r=13;r>=2;r--)o.push(s+r);return o}for(let r=14;r>=2;r--)o.push(s+r);return o;
}
function nzTop(st,s){const o=nzOrder(st.tr,s);for(const k of o)if(st.rem.has(k))return k;return null}
function nzPolicy(st,i){
  const h=st.H[i],tr=st.tr;let L=h.filter(c=>nzLegalH(h,st.trick,tr,c));if(!L.length)L=h.slice();if(L.length===1)return L[0];
  const mate=j=>st.team&&j!==i&&(j%2)===(i%2);
  const low=A=>A.reduce((a,b)=>{const va=(nzSuit(a,tr)===tr?50:0)+(a.s==='X'?60:0)+a.r,vb=(nzSuit(b,tr)===tr?50:0)+(b.s==='X'?60:0)+b.r;return vb<va?b:a});
  if(!st.trick.length){
    let best=null,bv=-1e9;const nj=L.filter(c=>c.s!=='X');if(nj.length)L=nj;
    for(const c of L){const s=nzSuit(c,tr),sure=nzTop(st,s)===key(c),n=h.filter(x=>nzSuit(x,tr)===s).length;
      let v=sure?(s===tr?60:100)+c.r:-(c.r)-(s===tr?25:0)+n*1.5;
      if(v>bv){bv=v;best=c}}
    return best;
  }
  const led=nzSuit(st.trick[0].c,tr);
  let w=st.trick[0];for(const t of st.trick)if(nzPow(t.c,tr,led)>nzPow(w.c,tr,led))w=t;
  const wp=nzPow(w.c,tr,led),last=st.trick.length===st.N-1;
  if(mate(w.p)&&(last||nzTop(st,nzSuit(w.c,tr))===key(w.c)))return low(L);
  const beats=L.filter(c=>nzPow(c,tr,led)>wp);
  if(beats.length){
    if(last)return beats.reduce((a,b)=>nzPow(b,tr,led)<nzPow(a,tr,led)?b:a);
    const sure=beats.filter(c=>nzTop(st,nzSuit(c,tr))===key(c));
    if(sure.length)return sure.reduce((a,b)=>nzPow(b,tr,led)<nzPow(a,tr,led)?b:a);
    return beats.reduce((a,b)=>nzPow(b,tr,led)<nzPow(a,tr,led)?b:a);
  }

}
function nzSPlay(st,i,c){
  st.H[i]=st.H[i].filter(x=>x!==c);st.trick.push({p:i,c});st.rem.delete(key(c));
  if(st.trick.length===st.N){const w=nzWin(st.trick,st.tr);st.won[w]++;st.trick=[];st.cur=w}
  else st.cur=(i+1)%st.N;
}
function nzRoll(st){let g=0;while(st.H[st.cur].length&&g++<120){const p=st.cur;nzSPlay(st,p,nzPolicy(st,p))}return st}
function nzEval(st,i,bids,changed){
  const R=nzResult(st.won,bids,changed,st.N,st.team);let v;
  if(st.team){v=R.pts[i]-R.pts[(i+1)%4]*1.1+(st.won[i]+st.won[(i+2)%4])*1.2}
  else{v=R.pts[i]+st.won[i]*1.5;for(let j=0;j<st.N;j++)if(j!==i)v-=R.pts[j]*(j===(i+1)%st.N?.9:.6)}

}
function nzSample(i,tr,useVoids){

    case 'gender':U.gender=v;saveUser();render();break;
    case 'lgender':{const a=document.getElementById('un'),b=document.getElementById('pw'),va=a?a.value:'',vb=b?b.value:'';LOGIN_G=v;render();const a2=document.getElementById('un'),b2=document.getElementById('pw');if(a2)a2.value=va;if(b2)b2.value=vb;break}
    case 'snp':U.np=+v;saveUser();if(SETUP.pass==='cycle')SETUP.pass='rl';SETUP.occ=['me',...shuffle([...CAST]).slice(0,U.np-1)];render();break;
    case 'scap':U.cap=+v;saveUser();render();break;
    case 'np':U.np=+v;saveUser();render();break;
    case 'cap':U.cap=+v;saveUser();render();break;
    case 'profile':PROF={name:dispName(),gender:U.gender||'m',av:meLook().id};MODAL='profile';render();break;
    case 'pgender':{const nm=document.getElementById('pname');if(nm)PROF.name=nm.value;PROF.gender=v;PROF.av=PLAYER_LOOKS.find(x=>x.g===v).id;render();break}
    case 'pav':{const nm=document.getElementById('pname');if(nm)PROF.name=nm.value;PROF.av=v;render();break}
    case 'psave':{const nm=document.getElementById('pname');const n=(nm?nm.value:PROF.name).trim();if(n)U.nick=n;U.gender=PROF.gender;U.av=PROF.av;saveUser();MODAL=null;render();break}
    case 'tbl':U.tbl=v;saveUser();render();break;
    case 'bgs':U.bgs=v;saveUser();render();break;
    case 'friends':MODAL='friends';render();break;
    case 'copylink':{const t=siteLink();try{navigator.clipboard.writeText(t).then(()=>{el.textContent='تم النسخ'},()=>{})}catch(e){}break}
    case 'settings':MODAL='settings';render();break;
    case 'toggle':U[v]=!U[v];saveUser();if(v==='snd'&&U.snd)slap();render();break;
    case 'card':{
      if(MODAL)return;
      const c=G.H[0][+v];if(!c)return;
      if(G.ph==='pass'){const k=G.sel.indexOf(c);if(k>=0)G.sel.splice(k,1);else if(G.sel.length<G.passN)G.sel.push(c);render()}
      else if(G.ph==='play'&&G.cur===0&&legal(0,c)){if(G.pick===c){G.pick=null;G.say='';play(0,c)}else{G.pick=c;render()}}
      break}
    case 'pass':if(G.sel.length===G.passN)doPass();break;
    case 'gseat':{const m=SETUP.occ.indexOf('me'),c=+v;[SETUP.occ[m],SETUP.occ[c]]=[SETUP.occ[c],SETUP.occ[m]];buildP();render();break}
    case 'grand':{shuffle(SETUP.occ);buildP();render();break}
    case 'gstart':if(G.ph==='seat')newRound();break;
    case 'gok':if(G.ph==='gift')toDecl();break;
    case 'acn':if(G.ph==='amir'){G.ac.n=+v;render()}break;
    case 'acd':if(G.ph==='amir'){G.ac.d=+v;render()}break;
    case 'acok':if(G.ph==='amir'){G.passN=G.ac.n;G.passDir=G.ac.d;amirGo()}break;
    case 'dm':G.minus[0]=!G.minus[0];render();break;
    case 'dq':G.decl.q=G.decl.q===0?-1:0;render();break;
    case 'dt':G.decl.t=G.decl.t===0?-1:0;render();break;
    case 'go':G.recvd=[];startPlay();break;
    case 'next':newRound();break;
    case 'nsetup':openNzSetup();break;
    case 'nnp':SETUP.occ=['me',...shuffle([...CAST]).slice(0,+v-1)];nzSaveCfg();render();break;
    case 'njk':SETUP.jk=v==='1';nzSaveCfg();render();break;
    case 'nteam':SETUP.team=v==='1';nzSaveCfg();render();break;
    case 'ncap':SETUP.cap=+v;nzSaveCfg();render();break;
    case 'nstart':goLandscape();newNzGame();break;
    case 'nbid':if(isNZ()&&G.ph==='bid'&&G.bidTurn===0){G.bids[0]=Math.min(+v,nzMaxBid());nzNextBidder()}break;
    case 'ntr':if(isNZ())nzSetTrump(v);break;
    case 'again':{const bots=G.P.slice(1).map(p=>p.look),nz=isNZ();G.token=0;SETUP.occ=['me',...bots];if(nz)newNzGame();else newGame();break}
    case 'home':clearGame();G.token=0;G=null;SCR='home';MODAL=null;render();break;
  }
}
let event=null;
/* ---- drag a card to the table (3D tilt) ---- */
let DRAG=null,DRAG_FROM=null,DRAG_SUPPRESS=false;
function toLocal(x,y){return ROT()?{x:y,y:innerWidth-x}:{x,y}}
app.addEventListener('pointerdown',e=>{
  if(SCR!=='game'||!G||MODAL)return;
  const el=e.target.closest('.hand .card');if(!el||e.button>0)return;
  const i=+el.dataset.v,c=G.H[0][i];if(!c)return;
  if(!(G.ph==='play'&&G.cur===0&&legal(0,c)))return;
  const r=el.getBoundingClientRect(),gr=app.getBoundingClientRect();
  DRAG={i,c,el,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),on:false,rx:0,ry:0,w:el.offsetWidth,h:el.offsetHeight,
        cx:r.left+r.width/2,cy:r.top+r.height/2,id:e.pointerId};
});
app.addEventListener('pointermove',e=>{
  if(!DRAG||e.pointerId!==DRAG.id)return;
  const dx=e.clientX-DRAG.sx,dy=e.clientY-DRAG.sy;
  if(!DRAG.on){
    if(Math.hypot(dx,dy)<9)return;
    DRAG.on=true;
    const g=DRAG.el.cloneNode(true);g.className+=' ghost';g.removeAttribute('data-a');g.style.cssText='';
    g.style.setProperty('--w',DRAG.w+'px');
    app.appendChild(g);DRAG.g=g;DRAG.el.style.visibility='hidden';
    try{app.setPointerCapture(e.pointerId)}catch(_){}
    swish();
  }
  const now=performance.now(),dt=Math.max(8,now-DRAG.t);
  let vx=(e.clientX-DRAG.lx)/dt,vy=(e.clientY-DRAG.ly)/dt;
  if(ROT()){const t=vx;vx=vy;vy=-t}
  DRAG.ry+=((Math.max(-1,Math.min(1,vx*.9))*28)-DRAG.ry)*.35;
  DRAG.rx+=((Math.max(-1,Math.min(1,-vy*.9))*28)-DRAG.rx)*.35;
  DRAG.lx=e.clientX;DRAG.ly=e.clientY;DRAG.t=now;
  const L=toLocal(e.clientX,e.clientY),ar=app.getBoundingClientRect();
  const ox=0,oy=0;
  const lift=Math.min(1,Math.max(0,-(ROT()?(-(e.clientX-DRAG.sx)):dy))/160);
  DRAG.g.style.transform=`translate(${L.x-ox-DRAG.w/2}px,${L.y-oy-DRAG.h/2}px) perspective(700px) rotateX(${(DRAG.rx+8*lift).toFixed(1)}deg) rotateY(${DRAG.ry.toFixed(1)}deg) scale(${(1.08+lift*.12).toFixed(3)})`;
  DRAG.g.style.boxShadow=`${(-DRAG.ry*.6).toFixed(0)}px ${(18+lift*22).toFixed(0)}px ${(22+lift*20).toFixed(0)}px rgba(0,0,0,.45)`;
  const tb=app.querySelector('.table');
  if(tb){const tr=tb.getBoundingClientRect();tb.classList.toggle('dropok',e.clientX>tr.left&&e.clientX<tr.right&&e.clientY>tr.top&&e.clientY<tr.bottom)}
});
function endDrag(e){
  if(!DRAG||(e&&e.pointerId!==DRAG.id))return;
  const D=DRAG;DRAG=null;
  if(!D.on)return;
  DRAG_SUPPRESS=true;setTimeout(()=>{DRAG_SUPPRESS=false},60);
  const tb=app.querySelector('.table');if(tb)tb.classList.remove('dropok');
  const gr=D.g.getBoundingClientRect();
  let over=false;if(tb&&e){const tr=tb.getBoundingClientRect();const pad=40;over=e.clientX>tr.left-pad&&e.clientX<tr.right+pad&&e.clientY>tr.top-pad&&e.clientY<tr.bottom+pad}
  const up=e?Math.hypot(e.clientX-D.sx,e.clientY-D.sy)>D.h*.9:false;
  if((over||up)&&G&&G.ph==='play'&&G.cur===0&&legal(0,D.c)){
    DRAG_FROM={x:gr.left+gr.width/2,y:gr.top+gr.height/2,w:ROT()?gr.height:gr.width};
    D.g.remove();G.say='';play(0,D.c);
  }else{
    const L=toLocal(D.cx,D.cy),ar=app.getBoundingClientRect(),ox=0,oy=0;
    D.g.style.transition='transform .28s cubic-bezier(.3,1.4,.5,1),box-shadow .28s';
    D.g.style.transform=`translate(${L.x-ox-D.w/2}px,${L.y-oy-D.h/2}px) rotateX(0) rotateY(0) scale(1)`;
    setTimeout(()=>{D.g.remove();D.el.style.visibility=''},290);
  }
}
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);
app.addEventListener('click',e=>{
  if(DRAG_SUPPRESS){DRAG_SUPPRESS=false;return}
  if(SCR==='game'&&G&&G.sbOpen&&!e.target.closest('.score')){G.sbOpen=false;render()}
  const el=e.target.closest('[data-a]');if(!el)return;
  event=e;act(el.dataset.a,el.dataset.v,el);
});
app.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='card'){e.preventDefault();act('card',e.target.dataset.v,e.target)}
  if(e.key==='Escape'&&MODAL&&MODAL!=='round'&&MODAL!=='over'){MODAL=null;render()}
});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(SCR==='game')render()},120)});

['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastT=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastT<320&&!(e.target.closest&&e.target.closest('input')))e.preventDefault();lastT=n},{passive:false});
window.addEventListener('orientationchange',()=>setTimeout(()=>{if(SCR==='game')render()},250));
loadSession();if(U){if(U.coins==null)U.coins=500;if(U.snd==null)U.snd=true;if(U.fx==null)U.fx=true}if(U)resumeGame();
render();
})();
</script>
